<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Content Fragment tests</title>
    <link rel="stylesheet" href="../../styles/styles.css">
    <link rel="stylesheet" href="../../blocks/content-fragment/content-fragment.css">
  </head>
  <body>
    <pre id="results"></pre>
    <script type="module">
      import decorate, { isAuthoringContext } from '../../blocks/content-fragment/content-fragment.js';
      import decorateSku from '../../blocks/faq-list-by-sku/faq-list-by-sku.js';
      import { connectAuthorFaqs, fetchAuthorFaqs, highlightAuthorFragment, registerAuthorFragments } from '../../scripts/content-fragment-author.js';
      import createPreviewChannel from '../../scripts/experimentation-channel.js';
      import createPanel from '../../tools/plugins/content-fragment/panel.js';

      const results = document.querySelector('#results');
      const originalFetch = window.fetch;
      const panelMarkup = await (await originalFetch('../../tools/plugins/content-fragment/content-fragment.html')).text();
      const originalReferrer = Object.getOwnPropertyDescriptor(document, 'referrer');
      let accessToken = 'test-ims-token';
      const path = '/content/dam/frescopa/en/faqs/do-i-have-to-buy-frescopa-pods';
      const secondPath = '/content/dam/frescopa/en/faqs/is-it-a-chore-to-clean';
      const id = '043d7fee-d38d-4b46-951c-67ad0e0177f6';
      const items = [
        { _id: id, question: 'First question?', answer: { plaintext: 'First answer.' } },
        { _id: 'de0c30b0-4745-47fa-b55d-d605cc4f5dde', question: 'Second question?', answer: { plaintext: '<b>Plain text answer.</b>' } },
      ];
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const fixture = (html, className = 'content-fragment') => {
        const block = document.createElement('div');
        block.className = className;
        block.innerHTML = html;
        document.body.append(block);
        return block;
      };
      const test = async (name, run) => {
        const disconnect = connectAuthorFaqs(window.location.href, () => accessToken, () => {});
        try {
          await run(disconnect);
          results.textContent += `PASS ${name}\n`;
        } catch (error) {
          results.textContent += `FAIL ${name}: ${error.message}\n`;
        } finally {
          disconnect();
          accessToken = 'test-ims-token';
          window.fetch = originalFetch;
          if (originalReferrer) Object.defineProperty(document, 'referrer', originalReferrer);
          else delete document.referrer;
          document.querySelectorAll('.content-fragment, .faq-list-by-sku').forEach((el) => el.remove());
        }
      };

      await test('authoring host, ancestor and referrer detection', async () => {
        for (const hostname of ['da.live', 'main--frescopa26--markszulc.preview.da.live', 'experience.adobe.com']) {
          assert(isAuthoringContext({ hostname }, ''), `authoring host ${hostname}`);
        }
        for (const origin of ['https://da.live', 'https://experience.adobe.com']) {
          assert(isAuthoringContext({ hostname: 'localhost', ancestorOrigins: [origin] }, ''), 'embedded authoring ancestor');
          assert(isAuthoringContext({ hostname: 'main--frescopa26--markszulc.aem.page' }, `${origin}/edit`), 'authoring referrer');
        }
        for (const hostname of ['localhost', '127.0.0.1', 'www.frescopa.coffee', 'main--frescopa26--markszulc.aem.page', 'main--frescopa26--markszulc.aem.live']) {
          assert(!isAuthoringContext({ hostname }, ''), `edge host ${hostname}`);
        }
        assert(!isAuthoringContext({ hostname: 'localhost' }, 'https://da.live.example.com/edit'), 'unrelated referrer');
      });

      await test('panel shows instance, live fragment states and safe editor links', async () => {
        const doc = new DOMParser().parseFromString(panelMarkup, 'text/html');
        const { showStatus, setPage } = createPanel(doc);
        const connection = doc.querySelector('details.author-card');
        assert(!connection.open && connection.querySelector('summary').textContent.includes('Author Connection'), 'connection troubleshooting collapsed by default');
        assert(Boolean(doc.querySelector('#fragments-heading').compareDocumentPosition(connection) & Node.DOCUMENT_POSITION_FOLLOWING), 'fragment list before connection details');
        setPage('https://main--frescopa26--markszulc.preview.da.live/drafts/fragmenttest');
        assert(doc.querySelector('#author-instance').href === 'https://author-p137825-e1511252.adobeaemcloud.com/', 'author instance link');
        assert(doc.querySelector('#page-path').textContent === '/drafts/fragmenttest', 'current page');
        showStatus('', { state: 'inventory', paths: [path, secondPath] });
        assert(doc.querySelectorAll('tbody tr').length === 2, 'references listed before fetching');
        assert(doc.querySelector('tbody td:last-child button').disabled && !doc.querySelector('tbody a'), 'no editor link without UUID');
        assert(doc.querySelector('.fragment-status').getAttribute('aria-label') === 'Waiting', 'accessible waiting state');
        showStatus('Loading', { state: 'loading', paths: [path, secondPath] });
        assert(doc.querySelector('.fragment-status').dataset.state === 'Loading', 'loading traffic light');
        showStatus('Connected', {
          state: 'connected', paths: [path, secondPath],
          items: [{ _path: path, _id: id, question: '<img src=x onerror=alert(1)>' }],
        });
        assert(doc.querySelector('#connection-state').textContent === 'Connected', 'actual connection state');
        const rows = doc.querySelectorAll('tbody tr');
        assert(rows[0].children[1].textContent === '' && rows[0].querySelector('.fragment-status').getAttribute('aria-label') === 'Loaded', 'traffic light replaces visible Loaded text accessibly');
        assert(rows[0].querySelector('.fragment-status').title === 'Loaded', 'status tooltip');
        assert(rows[1].querySelector('.fragment-status').dataset.state === 'Not found', 'missing result still listed');
        assert(rows[1].querySelector('td:last-child button').disabled, 'missing result cannot open incorrect editor');
        assert(!rows[0].querySelector('img'), 'fragment title treated as text');
        const edit = rows[0].querySelector('a');
        assert(edit.href === `https://experience.adobe.com/?repo=author-p137825-e1511252.adobeaemcloud.com#/@mark-szulc/aem/cf/editor/editor/${id}`, 'new editor URL uses actual fragment UUID');
        assert(edit.target === '_blank' && edit.rel.includes('noopener'), 'separate editor tab');
        assert(edit.getAttribute('aria-label').includes('opens in a new tab'), 'accessible action label');
        showStatus('Denied', { state: 'error', paths: [path] });
        assert(doc.querySelector('#connection-state').textContent === 'Connection error', 'error not shown as connected');
        assert(doc.querySelector('.fragment-status').getAttribute('aria-label') === 'Failed', 'accessible failed traffic light');
        showStatus('', { state: 'inventory', paths: [secondPath] });
        assert(doc.querySelectorAll('tbody tr').length === 1, 'removed references disappear');
        showStatus('', { state: 'inventory', paths: [] });
        assert(doc.querySelector('.table-scroll').hidden && !doc.querySelector('#empty-state').hidden, 'empty page state');
      });

      await test('fragment selection highlights only referencing blocks, scrolls and restores outlines', async (disconnect) => {
        const first = fixture('<div></div>');
        const second = fixture('<div></div>');
        const shared = fixture('<div></div>');
        first.style.setProperty('outline', '1px dashed red', 'important');
        registerAuthorFragments(first, [path]);
        registerAuthorFragments(second, [secondPath]);
        registerAuthorFragments(shared, [path, secondPath]);
        const scrolled = [];
        first.scrollIntoView = (options) => scrolled.push({ element: first, options });
        second.scrollIntoView = (options) => scrolled.push({ element: second, options });
        const doc = new DOMParser().parseFromString(panelMarkup, 'text/html');
        let selections = 0;
        const { showStatus } = createPanel(doc, (path) => {
          selections += 1;
          return highlightAuthorFragment(path);
        });
        showStatus('', { state: 'inventory', paths: [path, secondPath] });
        showStatus('Connected', {
          state: 'connected', paths: [path, secondPath],
          items: [{ ...items[0], _path: path }, { ...items[1], _path: secondPath }],
        });
        const activate = (button) => new Promise((resolve, reject) => {
          const message = doc.querySelector('#highlight-status');
          const observer = new MutationObserver(() => {
            clearTimeout(timer);
            observer.disconnect();
            resolve(message.textContent);
          });
          const timer = setTimeout(() => {
            observer.disconnect();
            reject(new Error('Missing highlight announcement'));
          }, 2000);
          observer.observe(message, { childList: true });
          button.click();
        });
        const names = doc.querySelectorAll('.fragment-name');
        assert(names[0].tagName === 'BUTTON' && !names[0].disabled, 'native keyboard-accessible fragment action');
        assert((await activate(names[0])) === 'Highlighted 2 blocks in the preview.', 'matching block count announced');
        assert(first.style.outline === 'rgb(59, 99, 251) solid 2px' && shared.style.outline === first.style.outline, 'all matching blocks outlined');
        assert(!second.style.outline, 'unrelated block unchanged');
        assert(scrolled.length === 1 && scrolled[0].element === first && scrolled[0].options.block === 'center', 'first reference scrolled into view');
        const edit = doc.querySelector('#fragments a');
        edit.addEventListener('click', event => event.preventDefault());
        edit.click();
        assert(selections === 1, 'Edit does not trigger block selection');
        await activate(names[1]);
        assert(first.style.outline === 'red dashed 1px' && first.style.getPropertyPriority('outline') === 'important', 'previous inline outline and priority restored');
        assert(second.style.outline === shared.style.outline && second.style.outline.includes('59, 99, 251'), 'selection moves to the other references');
        assert(scrolled.length === 2 && scrolled[1].element === second, 'new first reference scrolled');
        const replacement = fixture('<div></div>');
        registerAuthorFragments(replacement, [secondPath]);
        second.remove();
        shared.remove();
        await new Promise(resolve => setTimeout(resolve, 0));
        assert(replacement.style.outline.includes('59, 99, 251') && !second.style.outline && !shared.style.outline, 'live replacement with the same path retains highlight without stale outlines');
        await new Promise((resolve, reject) => {
          const observer = new MutationObserver(() => {
            if (replacement.style.outline) return;
            clearTimeout(timer);
            observer.disconnect();
            resolve();
          });
          const timer = setTimeout(() => {
            observer.disconnect();
            reject(new Error('Highlight remained after disconnect'));
          }, 2000);
          observer.observe(replacement, { attributes: true, attributeFilter: ['style'] });
          disconnect();
        });
        assert(!replacement.style.outline, 'disconnecting the panel clears highlighting');
      });

      await test('highlight failures are visible and requests stay scoped to the current page', async () => {
        const block = fixture('<div></div>');
        registerAuthorFragments(block, [path]);
        window.fetch = () => { throw new Error('Highlight must not fetch author content'); };
        const doc = new DOMParser().parseFromString(panelMarkup, 'text/html');
        const { showStatus } = createPanel(doc, value => highlightAuthorFragment(value));
        showStatus('', { state: 'inventory', paths: [secondPath] });
        const message = doc.querySelector('#highlight-status');
        await new Promise((resolve, reject) => {
          const observer = new MutationObserver(() => {
            clearTimeout(timer);
            observer.disconnect();
            resolve();
          });
          const timer = setTimeout(() => {
            observer.disconnect();
            reject(new Error('Missing highlight error'));
          }, 2000);
          observer.observe(message, { attributes: true, attributeFilter: ['hidden'] });
          doc.querySelector('.fragment-name').click();
        });
        assert(!message.hidden && message.textContent.includes('no longer referenced'), 'stale reference error outside collapsed connection details');
        assert(!doc.querySelector('.author-card').open && !doc.querySelector('.author-card').contains(message), 'highlight error visible without troubleshooting expansion');
        for (const [value, pageUrl, expected] of [
          ['/content/dam/../private', window.location.href, 'Expected FAQ'],
          [path, new URL('/unrelated-page', window.location.href).href, 'Open Layout or Split view'],
        ]) {
          let failure;
          try {
            await highlightAuthorFragment(value, pageUrl);
          } catch (error) {
            failure = error;
          }
          assert(failure?.message.includes(expected), 'invalid or disconnected highlight fails explicitly');
          assert(!block.style.outline, 'invalid or other-page request cannot highlight this page');
        }
      });

      await test('inventory includes all blocks, deduplicates paths and updates removals', async () => {
        const first = fixture('<div></div>');
        const second = fixture('<div></div>');
        registerAuthorFragments(first, [path, secondPath]);
        registerAuthorFragments(second, [path]);
        const channel = createPreviewChannel(window.location.href);
        const nextInventory = (expected) => new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('Missing inventory response')), 2000);
          channel.onmessage = ({ data }) => {
            if (data.action !== 'inventory' || !data.response) return;
            if (JSON.stringify(data.paths) !== JSON.stringify(expected)) return;
            clearTimeout(timer);
            resolve(data.paths);
          };
        });
        try {
          const initial = nextInventory([path, secondPath]);
          channel.postMessage({ type: 'da:content-fragment', action: 'inventory' });
          assert(JSON.stringify(await initial) === JSON.stringify([path, secondPath]), 'all unique page paths');
          const removed = nextInventory([path]);
          first.remove();
          assert(JSON.stringify(await removed) === JSON.stringify([path]), 'only remaining references');
        } finally {
          channel.close();
        }
      });

      await test('author GraphQL uses bearer authentication, path filters and authored order', async () => {
        Object.defineProperty(document, 'referrer', { configurable: true, value: 'https://da.live/edit' });
        const block = fixture(`<div><div>${path}<br>${secondPath}<br>${path}</div></div>`);
        let requests = 0;
        window.fetch = async (url, options) => {
          requests += 1;
          assert(options.headers.Authorization === 'Bearer test-ims-token', 'IMS bearer on both requests');
          assert(options.credentials === 'omit', 'no cross-site session cookies');
          if (requests === 1) {
            assert(String(url) === 'https://author-p137825-e1511252.adobeaemcloud.com/libs/granite/csrf/token.json', 'author CSRF endpoint');
            assert(options.cache === 'no-store', 'fresh authenticated token');
            return { ok: true, json: async () => ({ token: 'test-csrf-token' }) };
          }
          assert(url === 'https://author-p137825-e1511252.adobeaemcloud.com/content/_cq_graphql/frescopa/endpoint.json', 'author endpoint');
          assert(options.method === 'POST', 'authenticated POST');
          assert(options.headers['Content-Type'] === 'application/json', 'JSON request');
          assert(options.headers['CSRF-Token'] === 'test-csrf-token', 'CSRF token on POST');
          const { query, variables } = JSON.parse(options.body);
          assert(query.includes('faqList(filter: $filter)'), 'GraphQL filter applied');
          assert(query.includes('_id'), 'fragment UUID requested');
          assert(JSON.stringify(variables.filter._path) === JSON.stringify({
            _logOp: 'OR',
            _expressions: [path, secondPath].map((value) => ({ value, _operator: 'EQUALS' })),
          }), 'unique typed path expressions');
          return { ok: true, json: async () => ({ data: { faqList: { items: [
            { ...items[1], _path: secondPath },
            { ...items[0], _path: path },
            { ...items[0], _path: '/content/dam/unrequested' },
          ] } } }) };
        };
        await Promise.all([decorate(block), decorate(block)]);
        assert(requests === 2, 'one token request and one GraphQL request');
        assert(JSON.stringify([...block.querySelectorAll('.faq-label')].map((el) => el.textContent)) === JSON.stringify(items.map((item) => item.question)), 'requested results in authored order');
      });

      await test('author results retain UUIDs and reject missing or malformed UUIDs', async () => {
        for (const uuid of [id, undefined, 'not-a-uuid']) {
          window.fetch = async (url) => {
            if (String(url).endsWith('/libs/granite/csrf/token.json')) {
              return { ok: true, json: async () => ({ token: 'test-csrf-token' }) };
            }
            return { ok: true, json: async () => ({ data: { faqList: { items: [
              { ...items[0], _path: path, _id: uuid },
            ] } } }) };
          };
          let result;
          let failure;
          try {
            result = await fetchAuthorFaqs([path], accessToken);
          } catch (error) {
            failure = error;
          }
          if (uuid === id) assert(result?.[0]._id === id && !failure, 'UUID retained in sanitized result');
          else assert(failure?.message === 'Invalid author FAQ response.', 'invalid UUID reported explicitly');
        }
      });

      await test('refreshed token is used without sending credentials over the preview channel', async () => {
        Object.defineProperty(document, 'referrer', { configurable: true, value: 'https://da.live/edit' });
        const observer = createPreviewChannel(window.location.href);
        const messages = [];
        observer.onmessage = ({ data }) => messages.push(JSON.stringify(data));
        try {
          for (const token of ['test-ims-token', 'refreshed-ims-token']) {
            accessToken = token;
            window.fetch = async (url, options) => {
              assert(options.headers.Authorization === `Bearer ${token}`, 'current token on every request');
              if (String(url).endsWith('/libs/granite/csrf/token.json')) {
                return { ok: true, json: async () => ({ token: 'test-csrf-token' }) };
              }
              return { ok: true, json: async () => ({ data: { faqList: { items: [
                { ...items[0], _path: path, token: 'must-not-leak' },
              ] } } }) };
            };
            const block = fixture(`<div><div>${path}</div></div>`);
            await decorate(block);
            assert(block.querySelectorAll('details').length === 1, 'author result rendered');
          }
          assert(messages.length > 0, 'observed real channel messages');
          for (const secret of ['test-ims-token', 'refreshed-ims-token', 'test-csrf-token', 'must-not-leak']) {
            assert(messages.every((message) => !message.includes(secret)), 'credentials absent from channel');
          }
        } finally {
          observer.close();
        }
      });

      await test('missing IMS token prevents author requests and provides retry', async () => {
        Object.defineProperty(document, 'referrer', { configurable: true, value: 'https://da.live/edit' });
        accessToken = '';
        let requests = 0;
        window.fetch = async () => {
          requests += 1;
          throw new Error('Unexpected request');
        };
        const block = fixture(`<div><div>${path}</div></div>`);
        await decorate(block);
        assert(requests === 0, 'no anonymous author or edge request');
        assert(block.textContent.includes('Sign in to DA'), 'actionable guidance');
        assert(block.querySelector('button')?.textContent === 'Retry author connection', 'retry offered');
        accessToken = 'test-ims-token';
        window.fetch = async (url) => {
          if (String(url).endsWith('/libs/granite/csrf/token.json')) {
            return { ok: true, json: async () => ({ token: 'test-csrf-token' }) };
          }
          return { ok: true, json: async () => ({ data: { faqList: { items: [
            { ...items[0], _path: path },
          ] } } }) };
        };
        block.querySelector('button').click();
        await new Promise((resolve, reject) => {
          const observer = new MutationObserver(() => {
            if (block.querySelector('details')) {
              clearTimeout(timer);
              observer.disconnect();
              resolve();
            }
          });
          const timer = setTimeout(() => {
            observer.disconnect();
            reject(new Error('Retry did not render author FAQs'));
          }, 3000);
          observer.observe(block, { childList: true, subtree: true });
        });
        assert(block.querySelectorAll('details').length === 1, 'retry restored paths and rendered FAQs');
      });

      await test('a panel opened after decoration begins completes the pending request', async (disconnect) => {
        disconnect();
        Object.defineProperty(document, 'referrer', { configurable: true, value: 'https://da.live/edit' });
        window.fetch = async (url) => {
          if (String(url).endsWith('/libs/granite/csrf/token.json')) {
            return { ok: true, json: async () => ({ token: 'test-csrf-token' }) };
          }
          return { ok: true, json: async () => ({ data: { faqList: { items: [
            { ...items[0], _path: path },
          ] } } }) };
        };
        const block = fixture(`<div><div>${path}</div></div>`);
        const loading = decorate(block);
        await new Promise((resolve) => setTimeout(resolve, 50));
        const closePanel = connectAuthorFaqs(window.location.href, () => accessToken, () => {});
        try {
          await loading;
          assert(block.querySelectorAll('details').length === 1, 'late panel connection rendered FAQs');
        } finally {
          closePanel();
        }
      });

      await test('broker rejects invalid paths and does not answer other pages', async () => {
        let requests = 0;
        window.fetch = async () => {
          requests += 1;
          throw new Error('Unexpected request');
        };
        const channel = createPreviewChannel(window.location.href);
        const otherPage = createPreviewChannel(new URL('/unrelated-page', window.location.href).href);
        let otherPageReplied = false;
        otherPage.onmessage = () => { otherPageReplied = true; };
        try {
          const response = new Promise((resolve) => {
            channel.onmessage = ({ data }) => {
              if (data.requestId === 'invalid-path-test' && data.response) resolve(data);
            };
          });
          channel.postMessage({
            type: 'da:content-fragment', action: 'fetch', requestId: 'invalid-path-test',
            paths: ['/content/dam/../private'],
          });
          assert(typeof (await response).error === 'string', 'invalid path rejected explicitly');
          otherPage.postMessage({
            type: 'da:content-fragment', action: 'fetch', requestId: 'other-page-test', paths: [path],
          });
          await new Promise((resolve) => setTimeout(resolve, 100));
          assert(!otherPageReplied, 'unrelated page receives no response');
          assert(requests === 0, 'no author fetch for invalid or unrelated requests');
        } finally {
          channel.close();
          otherPage.close();
        }
      });

      await test('CSRF failures prevent the author POST and published fallback', async () => {
        Object.defineProperty(document, 'referrer', { configurable: true, value: 'https://da.live/edit' });
        const responses = [
          async () => ({ ok: false, status: 403 }),
          async () => ({ ok: true, json: async () => ({}) }),
          async () => ({ ok: true, json: async () => ({ token: ' ' }) }),
          async () => ({ ok: true, json: async () => ({ token: 123 }) }),
          async () => { throw new Error('Network failed'); },
        ];
        for (const response of responses) {
          let requests = 0;
          window.fetch = async (url) => {
            requests += 1;
            assert(String(url).endsWith('/libs/granite/csrf/token.json'), 'only CSRF endpoint requested');
            return response();
          };
          const block = fixture(`<div><div>${path}</div></div>`);
          await decorate(block);
          assert(requests === 1, 'no POST or published fallback');
          assert(block.querySelector('.faq-message')?.textContent.startsWith('Could not'), 'explicit token error');
          assert(!block.dataset.faqState, 'loading state cleared');
        }
      });

      await test('author failures never fall back to the Edge Function', async () => {
        Object.defineProperty(document, 'referrer', { configurable: true, value: 'https://experience.adobe.com/' });
        const responses = [
          async () => ({ ok: true, json: async () => ({ errors: [{ message: 'Denied' }], data: { faqList: { items: [] } } }) }),
          async () => ({ ok: true, json: async () => ({ data: { faqList: { items } } }) }),
          async () => ({ ok: false, status: 401 }),
          async () => ({ ok: false, status: 403 }),
          async () => { throw new Error('Network failed'); },
        ];
        for (const response of responses) {
          let requests = 0;
          window.fetch = async (url) => {
            requests += 1;
            if (String(url).endsWith('/libs/granite/csrf/token.json')) {
              return { ok: true, json: async () => ({ token: 'test-csrf-token' }) };
            }
            return response();
          };
          const block = fixture(`<div><div>${path}</div></div>`);
          await decorate(block);
          assert(requests === 2, 'no published-content fallback');
          assert(block.querySelector('.faq-message')?.textContent.startsWith('Could not'), 'explicit author error');
          assert(!block.dataset.faqState, 'loading state cleared');
        }
      });

      await test('paragraphs, line breaks, links and duplicate paths', async () => {
        const block = fixture(`<div><div><p>${path}</p>${secondPath}<br><a href="${path}">${path}</a></div></div>`);
        let requests = 0;
        window.fetch = async (url) => {
          requests += 1;
          const request = new URL(url);
          assert(request.origin + request.pathname === 'https://www.frescopa.coffee/faq-data-by-path', 'endpoint');
          assert(JSON.stringify(request.searchParams.getAll('path')) === JSON.stringify([path, secondPath]), 'repeated path parameters');
          return { ok: true, json: async () => ({ items }) };
        };
        await Promise.all([decorate(block), decorate(block)]);
        assert(requests === 1, 'one in-flight request');
        const faqs = block.querySelectorAll('details');
        assert(faqs.length === 2 && faqs[0].open && !faqs[1].open, 'initial open state');
        assert(faqs[0].name === faqs[1].name, 'single-open group');
        assert(block.querySelectorAll('.faq-chevron svg').length === 2, 'chevrons');
        assert(faqs[1].querySelector('.faq-body').textContent === items[1].answer.plaintext, 'plaintext preserved');
        assert(!faqs[1].querySelector('b'), 'no HTML injection');
        faqs[1].querySelector('summary').click();
        assert(faqs[1].open && !faqs[0].open, 'native accordion interaction');
        await decorate(block);
        assert(requests === 1, 'decoration is idempotent');
      });

      await test('separate authored rows', async () => {
        const block = fixture(`<div><div>${path}</div></div><div><div>${secondPath}</div></div>`);
        window.fetch = async (url) => {
          assert(new URL(url).searchParams.getAll('path').length === 2, 'both rows requested');
          return { ok: true, json: async () => ({ items }) };
        };
        await decorate(block);
        assert(block.querySelectorAll('details').length === 2, 'rendered');
      });

      await test('empty and invalid authoring does not fetch', async () => {
        window.fetch = () => { throw new Error('Unexpected fetch'); };
        for (const html of ['', '<div><div>not a fragment path</div></div>']) {
          const block = fixture(html);
          await decorate(block);
          assert(block.querySelector('.faq-message')?.textContent.startsWith('Add FAQ'), 'author guidance');
        }
      });

      await test('empty, malformed, HTTP and network responses', async () => {
        const responses = [
          async () => ({ ok: true, json: async () => ({ items: [] }) }),
          async () => ({ ok: true, json: async () => ({ items: null }) }),
          async () => ({ ok: true, json: async () => ({ items: [{}] }) }),
          async () => ({ ok: false, status: 500 }),
          async () => { throw new Error('Network failed'); },
        ];
        for (const [index, response] of responses.entries()) {
          window.fetch = response;
          const block = fixture(`<div><div>${path}</div></div>`);
          await decorate(block);
          assert(block.querySelector('.faq-message')?.textContent.startsWith(index ? 'Could not' : 'No FAQs'), 'explicit result message');
          assert(!block.dataset.faqState, 'loading state cleared');
        }
      });

      await test('pre-rendered answers preserve formatting and groups stay independent', async () => {
        window.fetch = () => { throw new Error('Unexpected fetch'); };
        const html = '<div><div>Question?</div><div><p><strong>Formatted answer</strong></p></div></div>';
        const first = fixture(html);
        const second = fixture(html, 'faq-list-by-sku');
        await decorate(first);
        await decorateSku(second);
        assert(first.querySelector('.faq-body strong'), 'answer formatting');
        assert(first.querySelector('details').name !== second.querySelector('details').name, 'independent groups');
        assert(first.querySelector('details').open && second.querySelector('details').open, 'both initially open');
      });

      await test('SKU fetching still uses the shared renderer', async () => {
        window.fetch = async (url) => {
          assert(new URL(url).searchParams.get('sku') === 'CSM6001', 'SKU parameter');
          return { ok: true, json: async () => ({ items }) };
        };
        const block = fixture('<div><div>SKU</div><div>CSM6001</div></div>', 'faq-list-by-sku');
        await decorateSku(block);
        assert(block.querySelectorAll('.faq-item').length === 2, 'SKU FAQs rendered');
      });

      document.body.dataset.testStatus = results.textContent.includes('FAIL') ? 'failed' : 'passed';
    </script>
  </body>
</html>
