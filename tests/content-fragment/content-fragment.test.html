<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Content Fragment tests</title>
    <link rel="stylesheet" href="../../styles/styles.css">
    <link rel="stylesheet" href="../../blocks/content-fragment/content-fragment.css">
  </head>
  <body>
    <pre id="results"></pre>
    <script type="module">
      import decorate, { isAuthoringContext } from '../../blocks/content-fragment/content-fragment.js';
      import decorateSku from '../../blocks/faq-list-by-sku/faq-list-by-sku.js';

      const results = document.querySelector('#results');
      const originalFetch = window.fetch;
      const originalReferrer = Object.getOwnPropertyDescriptor(document, 'referrer');
      const path = '/content/dam/frescopa/en/faqs/do-i-have-to-buy-frescopa-pods';
      const secondPath = '/content/dam/frescopa/en/faqs/is-it-a-chore-to-clean';
      const items = [
        { question: 'First question?', answer: { plaintext: 'First answer.' } },
        { question: 'Second question?', answer: { plaintext: '<b>Plain text answer.</b>' } },
      ];
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const fixture = (html, className = 'content-fragment') => {
        const block = document.createElement('div');
        block.className = className;
        block.innerHTML = html;
        document.body.append(block);
        return block;
      };
      const test = async (name, run) => {
        try {
          await run();
          results.textContent += `PASS ${name}\n`;
        } catch (error) {
          results.textContent += `FAIL ${name}: ${error.message}\n`;
        } finally {
          window.fetch = originalFetch;
          if (originalReferrer) Object.defineProperty(document, 'referrer', originalReferrer);
          else delete document.referrer;
          document.querySelectorAll('.content-fragment, .faq-list-by-sku').forEach((el) => el.remove());
        }
      };

      await test('authoring host, ancestor and referrer detection', async () => {
        for (const hostname of ['da.live', 'main--frescopa26--markszulc.preview.da.live', 'experience.adobe.com']) {
          assert(isAuthoringContext({ hostname }, ''), `authoring host ${hostname}`);
        }
        for (const origin of ['https://da.live', 'https://experience.adobe.com']) {
          assert(isAuthoringContext({ hostname: 'localhost', ancestorOrigins: [origin] }, ''), 'embedded authoring ancestor');
          assert(isAuthoringContext({ hostname: 'main--frescopa26--markszulc.aem.page' }, `${origin}/edit`), 'authoring referrer');
        }
        for (const hostname of ['localhost', '127.0.0.1', 'www.frescopa.coffee', 'main--frescopa26--markszulc.aem.page', 'main--frescopa26--markszulc.aem.live']) {
          assert(!isAuthoringContext({ hostname }, ''), `edge host ${hostname}`);
        }
        assert(!isAuthoringContext({ hostname: 'localhost' }, 'https://da.live.example.com/edit'), 'unrelated referrer');
      });

      await test('author GraphQL uses cookies, path filters and authored order', async () => {
        Object.defineProperty(document, 'referrer', { configurable: true, value: 'https://da.live/edit' });
        const block = fixture(`<div><div>${path}<br>${secondPath}<br>${path}</div></div>`);
        let requests = 0;
        window.fetch = async (url, options) => {
          requests += 1;
          assert(url === 'https://author-p137825-e1511252.adobeaemcloud.com/content/_cq_graphql/frescopa/endpoint.json', 'author endpoint');
          assert(options.method === 'POST' && options.credentials === 'include', 'authenticated POST');
          assert(options.headers['content-type'] === 'application/json', 'JSON request');
          const { query, variables } = JSON.parse(options.body);
          assert(query.includes('faqList(filter: $filter)'), 'GraphQL filter applied');
          assert(JSON.stringify(variables.filter._path) === JSON.stringify({
            _logOp: 'OR',
            _expressions: [path, secondPath].map((value) => ({ value, _operator: 'EQUALS' })),
          }), 'unique typed path expressions');
          return { ok: true, json: async () => ({ data: { faqList: { items: [
            { ...items[1], _path: secondPath },
            { ...items[0], _path: path },
            { ...items[0], _path: '/content/dam/unrequested' },
          ] } } }) };
        };
        await Promise.all([decorate(block), decorate(block)]);
        assert(requests === 1, 'one author request');
        assert(JSON.stringify([...block.querySelectorAll('.faq-label')].map((el) => el.textContent)) === JSON.stringify(items.map((item) => item.question)), 'requested results in authored order');
      });

      await test('author failures never fall back to the Edge Function', async () => {
        Object.defineProperty(document, 'referrer', { configurable: true, value: 'https://experience.adobe.com/' });
        const responses = [
          async () => ({ ok: true, json: async () => ({ errors: [{ message: 'Denied' }], data: { faqList: { items: [] } } }) }),
          async () => ({ ok: true, json: async () => ({ data: { faqList: { items } } }) }),
          async () => ({ ok: false, status: 401 }),
          async () => { throw new Error('Network failed'); },
        ];
        for (const response of responses) {
          let requests = 0;
          window.fetch = async () => { requests += 1; return response(); };
          const block = fixture(`<div><div>${path}</div></div>`);
          await decorate(block);
          assert(requests === 1, 'no published-content fallback');
          assert(block.querySelector('.faq-message')?.textContent.startsWith('Could not'), 'explicit author error');
          assert(!block.dataset.faqState, 'loading state cleared');
        }
      });

      await test('paragraphs, line breaks, links and duplicate paths', async () => {
        const block = fixture(`<div><div><p>${path}</p>${secondPath}<br><a href="${path}">${path}</a></div></div>`);
        let requests = 0;
        window.fetch = async (url) => {
          requests += 1;
          const request = new URL(url);
          assert(request.origin + request.pathname === 'https://www.frescopa.coffee/faq-data-by-path', 'endpoint');
          assert(JSON.stringify(request.searchParams.getAll('path')) === JSON.stringify([path, secondPath]), 'repeated path parameters');
          return { ok: true, json: async () => ({ items }) };
        };
        await Promise.all([decorate(block), decorate(block)]);
        assert(requests === 1, 'one in-flight request');
        const faqs = block.querySelectorAll('details');
        assert(faqs.length === 2 && faqs[0].open && !faqs[1].open, 'initial open state');
        assert(faqs[0].name === faqs[1].name, 'single-open group');
        assert(block.querySelectorAll('.faq-chevron svg').length === 2, 'chevrons');
        assert(faqs[1].querySelector('.faq-body').textContent === items[1].answer.plaintext, 'plaintext preserved');
        assert(!faqs[1].querySelector('b'), 'no HTML injection');
        faqs[1].querySelector('summary').click();
        assert(faqs[1].open && !faqs[0].open, 'native accordion interaction');
        await decorate(block);
        assert(requests === 1, 'decoration is idempotent');
      });

      await test('separate authored rows', async () => {
        const block = fixture(`<div><div>${path}</div></div><div><div>${secondPath}</div></div>`);
        window.fetch = async (url) => {
          assert(new URL(url).searchParams.getAll('path').length === 2, 'both rows requested');
          return { ok: true, json: async () => ({ items }) };
        };
        await decorate(block);
        assert(block.querySelectorAll('details').length === 2, 'rendered');
      });

      await test('empty and invalid authoring does not fetch', async () => {
        window.fetch = () => { throw new Error('Unexpected fetch'); };
        for (const html of ['', '<div><div>not a fragment path</div></div>']) {
          const block = fixture(html);
          await decorate(block);
          assert(block.querySelector('.faq-message')?.textContent.startsWith('Add FAQ'), 'author guidance');
        }
      });

      await test('empty, malformed, HTTP and network responses', async () => {
        const responses = [
          async () => ({ ok: true, json: async () => ({ items: [] }) }),
          async () => ({ ok: true, json: async () => ({ items: null }) }),
          async () => ({ ok: true, json: async () => ({ items: [{}] }) }),
          async () => ({ ok: false, status: 500 }),
          async () => { throw new Error('Network failed'); },
        ];
        for (const [index, response] of responses.entries()) {
          window.fetch = response;
          const block = fixture(`<div><div>${path}</div></div>`);
          await decorate(block);
          assert(block.querySelector('.faq-message')?.textContent.startsWith(index ? 'Could not' : 'No FAQs'), 'explicit result message');
          assert(!block.dataset.faqState, 'loading state cleared');
        }
      });

      await test('pre-rendered answers preserve formatting and groups stay independent', async () => {
        window.fetch = () => { throw new Error('Unexpected fetch'); };
        const html = '<div><div>Question?</div><div><p><strong>Formatted answer</strong></p></div></div>';
        const first = fixture(html);
        const second = fixture(html, 'faq-list-by-sku');
        await decorate(first);
        await decorateSku(second);
        assert(first.querySelector('.faq-body strong'), 'answer formatting');
        assert(first.querySelector('details').name !== second.querySelector('details').name, 'independent groups');
        assert(first.querySelector('details').open && second.querySelector('details').open, 'both initially open');
      });

      await test('SKU fetching still uses the shared renderer', async () => {
        window.fetch = async (url) => {
          assert(new URL(url).searchParams.get('sku') === 'CSM6001', 'SKU parameter');
          return { ok: true, json: async () => ({ items }) };
        };
        const block = fixture('<div><div>SKU</div><div>CSM6001</div></div>', 'faq-list-by-sku');
        await decorateSku(block);
        assert(block.querySelectorAll('.faq-item').length === 2, 'SKU FAQs rendered');
      });

      document.body.dataset.testStatus = results.textContent.includes('FAIL') ? 'failed' : 'passed';
    </script>
  </body>
</html>
